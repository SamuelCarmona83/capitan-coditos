networks:
  app-network:
    driver: bridge

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: capitan-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - app-network
    depends_on:
      - api

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: capitan-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5001:5000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  celery-worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: capitan-celery-worker
    command: celery -A tasks.celery_app.celery_app worker --loglevel=info --concurrency=2
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - redis
      - mongo
    healthcheck:
      test: ["CMD-SHELL", "celery -A tasks.celery_app.celery_app inspect ping --timeout 5 2>/dev/null | grep -q OK || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    networks:
      - app-network

  celery-beat:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: capitan-celery-beat
    command: celery -A tasks.celery_app.celery_app beat --loglevel=info
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - redis
      - mongo
    healthcheck:
      test: ["CMD-SHELL", "test -f celerybeat-schedule && exit 0 || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - app-network

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: capitan-coditos
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - API_BASE_URL=http://api:5000
    depends_on:
      - api
    networks:
      - app-network

  mongo:
    image: mongo:7
    container_name: capitan-mongo
    restart: unless-stopped
    volumes:
      - mongodata:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: capitan-redis
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  mongodata:
