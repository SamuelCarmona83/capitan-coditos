<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capitán Coditos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
    <style>
        html,
        body {
            overflow: hidden;
            height: 100%;
        }

        #summoner-list {
            scrollbar-width: thin;
            scrollbar-color: #475569 transparent;
        }

        #summoner-list::-webkit-scrollbar {
            width: 4px;
        }

        #summoner-list::-webkit-scrollbar-track {
            background: transparent;
        }

        #summoner-list::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 2px;
        }

        #match-list {
            scrollbar-width: thin;
            scrollbar-color: #475569 transparent;
        }
        #match-list::-webkit-scrollbar { width: 4px; }
        #match-list::-webkit-scrollbar-track { background: transparent; }
        #match-list::-webkit-scrollbar-thumb { background: #475569; border-radius: 2px; }

        @keyframes shimmer {
            0% { background-position: -400px 0 }
            100% { background-position: 400px 0 }
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .skeleton {
            background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
            background-size: 800px 100%;
            animation: shimmer 1.4s infinite linear;
            border-radius: 4px;
        }

        /* ── Mobile responsive ──────────────────────────────────── */
        .mobile-hidden { display: none !important; }
        @media (max-width: 639px) {
            /* Each panel takes the full viewport and stacks — JS shows one at a time */
            #summoner-sidebar, #match-section, #splash, #detail-panel {
                position: absolute;
                inset: 0;
                width: 100% !important;
                max-width: 100% !important;
                border-right: none !important;
                z-index: 1;
            }
            #profile-header { height: 160px !important; }
            #detail-panel  { overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 80px !important; }
            #summoner-list { padding-bottom: 60px; }
            #match-list    { padding-bottom: 60px; }
        }
    </style>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col select-none">

    <footer
    <footer class="fixed bottom-0 inset-x-0 z-40 bg-slate-900/90 backdrop-blur border-t border-slate-700/50 px-6 pointer-events-none">
        <!-- Progress bar (hidden when idle) -->
        <div id="sync-progress-bar-wrap" class="hidden w-full h-0.5 bg-slate-700 rounded overflow-hidden">
            <div id="sync-progress-bar" class="h-full bg-violet-500 transition-all duration-500" style="width:0%"></div>
        </div>
        <div class="flex items-center justify-between py-1.5 text-xs text-slate-500">
            <span>Capitán Coditos &mdash; League of Legends match tracker</span>
            <span id="footer-status">Ready</span>
        </div>
    </footer>

    <header class="bg-slate-800 border-b border-slate-700 px-6 py-3 shrink-0 flex items-center justify-between">
        <span class="font-bold">Capitán Coditos</span>
        <button onclick="openModal()"
            class="flex items-center gap-1.5 px-3 py-1.5 bg-violet-700 hover:bg-violet-600 rounded text-sm font-medium transition-colors">
            <span>＋</span> Add summoner
        </button>
    </header>

    <!-- Add summoner modal -->
    <div id="modal-backdrop" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center"
        onclick="closeModal(event)">
        <div class="bg-slate-800 rounded-xl shadow-2xl w-full max-w-sm mx-4 p-5" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between mb-4">
                <h2 class="font-semibold text-base">Add</h2>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white text-lg leading-none">✕</button>
            </div>

            <label class="block text-xs text-slate-400 mb-1">Riot ID <span
                    class="text-slate-500">(Name#TAG)</span></label>
            <div class="relative mb-3">
                <input id="modal-input" type="text" placeholder="Roga#LAN" autocomplete="off" spellcheck="false"
                    class="w-full bg-slate-700 rounded px-3 py-2 text-sm outline-none focus:ring-1 focus:ring-violet-500 placeholder-slate-500">
                <ul id="modal-autocomplete"
                    class="hidden absolute top-full left-0 right-0 bg-slate-700 rounded-b shadow-lg z-10 max-h-36 overflow-y-auto">
                </ul>
            </div>

            <label class="block text-xs text-slate-400 mb-1">Region</label>
            <select id="modal-region"
                class="w-full bg-slate-700 rounded px-3 py-2 text-sm outline-none focus:ring-1 focus:ring-violet-500 mb-4">
                <option>LAN</option>
                <option>LAS</option>
                <option>NA</option>
                <option>BR</option>
                <option>EUW</option>
                <option>EUNE</option>
                <option>TR</option>
                <option>RU</option>
                <option>KR</option>
                <option>JP</option>
                <option>OCE</option>
            </select>

            <div id="modal-status" class="text-xs text-slate-400 mb-3 min-h-[1rem]"></div>

            <button id="modal-submit-btn" onclick="submitModal()"
                class="w-full bg-violet-700 hover:bg-violet-600 rounded py-2 text-sm font-medium transition-colors disabled:opacity-50">
                Load matches
            </button>
        </div>
    </div>

    <div class="flex flex-1 overflow-hidden relative" style="height:calc(100vh - 49px)">

        <!-- Summoner sidebar -->
        <aside id="summoner-sidebar" class="w-48 shrink-0 bg-slate-800 border-r border-slate-700 flex flex-col overflow-hidden">
            <div class="p-2 border-b border-slate-700 shrink-0">
                <input id="search" type="text" placeholder="Search…" autocomplete="off"
                    class="w-full bg-slate-700 rounded px-2 py-1.5 text-sm outline-none placeholder-slate-400 focus:ring-1 focus:ring-violet-500">
            </div>
            <ul id="summoner-list" class="flex-1 overflow-y-scroll pb-8"></ul>
        </aside>

        <!-- Match list -->
        <section id="match-section" class="hidden w-64 shrink-0 border-r border-slate-700 flex flex-col overflow-hidden">
            <div class="px-3 py-2 border-b border-slate-700 shrink-0 flex items-center justify-between">
                <div class="flex items-center gap-1">
                    <button onclick="setMobilePanel('profile')" class="sm:hidden text-slate-400 hover:text-white p-1 rounded" title="Back to profile">&#8592;</button>
                    <div id="match-list-header" class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Matches</div>
                </div>
                <button id="sync-btn" onclick="syncSummoner()" title="Sync latest matches"
                    class="hidden text-slate-400 hover:text-white transition-colors p-0.5 rounded hover:bg-slate-700">
                    <svg id="sync-icon" xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="23 4 23 10 17 10" />
                        <polyline points="1 20 1 14 7 14" />
                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
                    </svg>
                </button>
            </div>
            <div id="match-list" class="flex-1 overflow-y-auto">
                <p class="p-4 text-slate-500 text-sm">Select a summoner.</p>
            </div>
        </section>

        <!-- No-summoner splash -->
        <div id="splash" class="flex-1 overflow-hidden relative flex flex-col items-center justify-center"
            style="min-width:0">
            <div class="absolute inset-0" style="overflow:hidden" id="splash-track"></div>
            <div class="relative z-10 text-center pointer-events-none">
                <div class="text-4xl font-black tracking-tight mb-1">Capitán Coditos</div>
                <div class="text-slate-400">Select a summoner to view their stats</div>
            </div>
        </div>

        <!-- Profile / Match detail -->
        <div id="detail-panel" class="flex-1 overflow-y-auto p-4 pb-8 hidden">

            <!-- Compact strip shown when a match is open -->
            <div id="profile-strip"
                class="hidden flex items-center gap-3 bg-slate-800 rounded-lg px-4 py-2 mb-4 text-sm">
                <div id="strip-champs" class="flex gap-1"></div>
                <div id="strip-name" class="font-semibold"></div>
                <div id="strip-stats" class="text-slate-400 text-xs"></div>
                <button onclick="closeMatch()"
                    class="ml-auto text-slate-400 hover:text-white text-xs px-2 py-1 rounded hover:bg-slate-700 transition-colors">✕
                    Close match</button>
            </div>

            <!-- Full profile, hidden when match is open -->
            <div id="profile-view">
                <!-- Profile header: splash + icon + name + rank -->
                <div id="profile-header" class="relative rounded-xl overflow-hidden mb-4" style="height:260px;background:#1e293b">
                    <div id="profile-splash-bg" class="absolute inset-0" style="background-size:cover;background-position:center 15%;filter:brightness(0.38) saturate(1.3);transition:opacity 0.5s ease"></div>
                    <div class="absolute inset-0" style="background:linear-gradient(to top, rgba(15,23,42,0.95) 0%, rgba(15,23,42,0.3) 60%, transparent 100%)"></div>
                    <div class="relative z-10 flex items-end gap-3 p-4 h-full">
                        <img id="profile-icon" src="" class="w-16 h-16 rounded-lg border-2 border-slate-500 shrink-0 shadow-lg" onerror="this.style.display='none'">
                        <div class="flex-1 min-w-0">
                            <div class="text-xl font-bold leading-tight truncate" id="profile-name"></div>
                            <div class="text-xs text-slate-400 mt-0.5" id="profile-level"></div>
                        </div>
                        <div id="profile-rank-badge" class="shrink-0"></div>
                    </div>
                    <!-- Close profile button -->
                    <button onclick="closeProfile()" title="Close profile"
                        class="absolute top-2 right-2 z-20 w-7 h-7 flex items-center justify-center rounded-full bg-slate-900/60 hover:bg-slate-900/90 text-slate-400 hover:text-white transition-colors text-sm">
                        ✕
                    </button>
                </div>
                <!-- Mode tabs -->
                <div class="flex gap-1 mb-4" id="mode-tabs">
                    <button onclick="switchMode('all')" data-mode="all"
                        class="tab-btn px-3 py-1 rounded text-sm">All</button>
                    <button onclick="switchMode('ranked')" data-mode="ranked"
                        class="tab-btn px-3 py-1 rounded text-sm">Ranked</button>
                    <button onclick="switchMode('normal')" data-mode="normal"
                        class="tab-btn px-3 py-1 rounded text-sm">Normal</button>
                    <button onclick="switchMode('aram')" data-mode="aram"
                        class="tab-btn px-3 py-1 rounded text-sm">ARAM</button>
                </div>

                <!-- Mobile: tap to view match list -->
                <button id="mobile-matches-btn" onclick="setMobilePanel('matches')"
                    class="sm:hidden w-full mb-3 py-2 text-sm bg-slate-800 rounded-lg text-slate-300 hover:bg-slate-700 transition-colors">
                    &#9776; Match History
                </button>
                <!-- Stats row -->
                <div id="stats-row" class="grid grid-cols-3 gap-3 mb-3"></div>

                <!-- Compact insight row: WR ring | Top champs | Duration win% -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4">
                    <!-- WR ring -->
                    <div class="bg-slate-800 rounded-lg p-3 flex flex-col items-center justify-center gap-1">
                        <div style="height:96px;width:96px;position:relative">
                            <canvas id="chart-winrate"></canvas>
                            <div id="winrate-label"
                                class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                                <span class="text-lg font-bold leading-none"></span>
                                <span class="text-xs text-slate-500">WR</span>
                            </div>
                        </div>
                        <div id="duration-avg" class="text-xs font-semibold text-slate-300">—</div>
                        <div class="text-xs text-slate-600">avg duration</div>
                    </div>
                    <!-- Top champs compact -->
                    <div class="bg-slate-800 rounded-lg p-3">
                        <div class="text-xs text-slate-500 uppercase tracking-wider mb-2">Top Champs</div>
                        <div id="champ-grid" class="space-y-1.5"></div>
                    </div>
                    <!-- Duration win% chart (auto-loads) -->
                    <div class="bg-slate-800 rounded-lg p-3 flex flex-col">
                        <div class="flex items-center justify-between mb-1.5 shrink-0">
                            <div class="text-xs text-slate-500 uppercase tracking-wider">⏱ Win% by Duration</div>
                            <div id="duration-meta" class="flex gap-2 text-xs text-slate-500"></div>
                            <button id="duration-btn" onclick="runDurationAnalysis(true)"
                                class="text-xs text-violet-400 hover:text-violet-300 transition-colors ml-2">&#8635;</button>
                        </div>
                        <div id="duration-content" class="flex-1 relative overflow-hidden min-h-[160px] sm:min-h-0">
                            <div class="absolute inset-0 flex items-center justify-center text-slate-600 text-xs">Loading…</div>
                        </div>
                    </div>
                </div>

                <!-- Champion grid (hidden, replaced by compact list above) -->
                <div id="champ-chart-row" class="hidden"></div>
            </div>

            <!-- Match detail, hidden by default -->
            <div id="match-view" class="hidden">
                <div id="match-content"></div>
            </div>

        </div>
    </div>

    <script src="/static/js/constants.js"></script>
    <script src="/static/js/components.js"></script>
    <script src="/static/js/mobile.js"></script>
    <script src="/static/js/app.js"></script>
</body>

</html>
