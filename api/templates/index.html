<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capitán Coditos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
    <style>
        html,
        body {
            overflow: hidden;
            height: 100%;
        }

        #summoner-list {
            scrollbar-width: thin;
            scrollbar-color: #475569 transparent;
        }

        #summoner-list::-webkit-scrollbar {
            width: 4px;
        }

        #summoner-list::-webkit-scrollbar-track {
            background: transparent;
        }

        #summoner-list::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 2px;
        }

        @keyframes shimmer {
            0% { background-position: -400px 0 }
            100% { background-position: 400px 0 }
        }
        .skeleton {
            background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
            background-size: 800px 100%;
            animation: shimmer 1.4s infinite linear;
            border-radius: 4px;
        }
    </style>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col select-none">

    <header class="bg-slate-800 border-b border-slate-700 px-6 py-3 shrink-0 flex items-center justify-between">
        <span class="font-bold">Capitán Coditos</span>
        <button onclick="openModal()"
            class="flex items-center gap-1.5 px-3 py-1.5 bg-violet-700 hover:bg-violet-600 rounded text-sm font-medium transition-colors">
            <span>＋</span> Add summoner
        </button>
    </header>

    <!-- Add summoner modal -->
    <div id="modal-backdrop" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center"
        onclick="closeModal(event)">
        <div class="bg-slate-800 rounded-xl shadow-2xl w-full max-w-sm mx-4 p-5" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between mb-4">
                <h2 class="font-semibold text-base">Add / Fix summoner</h2>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white text-lg leading-none">✕</button>
            </div>

            <label class="block text-xs text-slate-400 mb-1">Riot ID <span
                    class="text-slate-500">(Name#TAG)</span></label>
            <div class="relative mb-3">
                <input id="modal-input" type="text" placeholder="Roga#LAN" autocomplete="off" spellcheck="false"
                    class="w-full bg-slate-700 rounded px-3 py-2 text-sm outline-none focus:ring-1 focus:ring-violet-500 placeholder-slate-500">
                <ul id="modal-autocomplete"
                    class="hidden absolute top-full left-0 right-0 bg-slate-700 rounded-b shadow-lg z-10 max-h-36 overflow-y-auto">
                </ul>
            </div>

            <label class="block text-xs text-slate-400 mb-1">Region</label>
            <select id="modal-region"
                class="w-full bg-slate-700 rounded px-3 py-2 text-sm outline-none focus:ring-1 focus:ring-violet-500 mb-4">
                <option>LAN</option>
                <option>LAS</option>
                <option>NA</option>
                <option>BR</option>
                <option>EUW</option>
                <option>EUNE</option>
                <option>TR</option>
                <option>RU</option>
                <option>KR</option>
                <option>JP</option>
                <option>OCE</option>
            </select>

            <div id="modal-status" class="text-xs text-slate-400 mb-3 min-h-[1rem]"></div>

            <button id="modal-submit-btn" onclick="submitModal()"
                class="w-full bg-violet-700 hover:bg-violet-600 rounded py-2 text-sm font-medium transition-colors disabled:opacity-50">
                Load matches
            </button>
        </div>
    </div>

    <div class="flex flex-1 overflow-hidden" style="height:calc(100vh - 49px)">

        <!-- Summoner sidebar -->
        <aside class="w-48 shrink-0 bg-slate-800 border-r border-slate-700 flex flex-col overflow-hidden">
            <div class="p-2 border-b border-slate-700 shrink-0">
                <input id="search" type="text" placeholder="Search…" autocomplete="off"
                    class="w-full bg-slate-700 rounded px-2 py-1.5 text-sm outline-none placeholder-slate-400 focus:ring-1 focus:ring-violet-500">
            </div>
            <ul id="summoner-list" class="flex-1 overflow-y-scroll"></ul>
        </aside>

        <!-- Match list -->
        <section class="w-64 shrink-0 border-r border-slate-700 flex flex-col overflow-hidden">
            <div id="match-list-header"
                class="px-3 py-2 text-xs font-semibold text-slate-400 uppercase tracking-wider border-b border-slate-700 shrink-0">
                Matches</div>
            <div id="match-list" class="flex-1 overflow-y-auto divide-y divide-slate-700/40">
                <p class="p-4 text-slate-500 text-sm">Select a summoner.</p>
            </div>
        </section>

        <!-- No-summoner splash -->
        <div id="splash" class="flex-1 overflow-hidden relative flex flex-col items-center justify-center"
            style="min-width:0">
            <div class="absolute inset-0" style="overflow:hidden" id="splash-track"></div>
            <div class="relative z-10 text-center pointer-events-none">
                <div class="text-4xl font-black tracking-tight mb-1">Capitán Coditos</div>
                <div class="text-slate-400">Select a summoner to view their stats</div>
            </div>
        </div>

        <!-- Profile / Match detail -->
        <div id="detail-panel" class="flex-1 overflow-y-auto p-4 hidden">

            <!-- Compact strip shown when a match is open -->
            <div id="profile-strip"
                class="hidden flex items-center gap-3 bg-slate-800 rounded-lg px-4 py-2 mb-4 text-sm">
                <div id="strip-champs" class="flex gap-1"></div>
                <div id="strip-name" class="font-semibold"></div>
                <div id="strip-stats" class="text-slate-400 text-xs"></div>
                <button onclick="closeMatch()"
                    class="ml-auto text-slate-400 hover:text-white text-xs px-2 py-1 rounded hover:bg-slate-700 transition-colors">✕
                    Close match</button>
            </div>

            <!-- Full profile, hidden when match is open -->
            <div id="profile-view">
                <!-- Mode tabs -->
                <div class="flex gap-1 mb-4" id="mode-tabs">
                    <button onclick="switchMode('all')" data-mode="all"
                        class="tab-btn px-3 py-1 rounded text-sm">All</button>
                    <button onclick="switchMode('ranked')" data-mode="ranked"
                        class="tab-btn px-3 py-1 rounded text-sm">Ranked</button>
                    <button onclick="switchMode('normal')" data-mode="normal"
                        class="tab-btn px-3 py-1 rounded text-sm">Normal</button>
                    <button onclick="switchMode('aram')" data-mode="aram"
                        class="tab-btn px-3 py-1 rounded text-sm">ARAM</button>
                </div>

                <!-- Stats row -->
                <div id="stats-row" class="grid grid-cols-3 gap-3 mb-4"></div>

                <!-- Charts row -->
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div class="bg-slate-800 rounded-lg p-3 flex flex-col items-center">
                        <div class="text-xs text-slate-400 mb-2 uppercase tracking-wider">Win Rate</div>
                        <div style="height:140px;width:140px;position:relative">
                            <canvas id="chart-winrate"></canvas>
                            <div id="winrate-label"
                                class="absolute inset-0 flex items-center justify-center text-xl font-bold pointer-events-none">
                            </div>
                        </div>
                    </div>
                    <div class="bg-slate-800 rounded-lg p-3">
                        <div class="text-xs text-slate-400 mb-2 uppercase tracking-wider">Top Champions</div>
                        <canvas id="chart-champs" style="max-height:140px"></canvas>
                    </div>
                </div>

                <!-- Champion grid -->
                <div id="champ-grid" class="grid grid-cols-4 gap-2"></div>
            </div>

            <!-- Match detail, hidden by default -->
            <div id="match-view" class="hidden">
                <div id="match-content"></div>
            </div>

        </div>
    </div>

    <script>
        let DD = 'https://ddragon.leagueoflegends.com/cdn/14.24.1';
        let allSummoners = [];
        let activeSummonerId = null;
        let activeMatches = [];
        let activeStats = null;
        let activeMode = 'all';
        let activeMatchEl = null;
        let chartWR = null, chartCH = null;

        const QUEUE_LABEL = { 420: 'Ranked', 440: 'Ranked Flex', 450: 'ARAM', 400: 'Normal', 430: 'Normal Blind', 0: 'Custom' };

        const CHAMP_KEYS = {
            'Wukong': 'MonkeyKing', 'Nunu & Willump': 'Nunu', "Cho'Gath": 'Chogath',
            "Kai'Sa": 'Kaisa', "Kha'Zix": 'Khazix', "Kog'Maw": 'KogMaw',
            'LeBlanc': 'Leblanc', "Vel'Koz": 'Velkoz', "Rek'Sai": 'RekSai',
            'Renata Glasc': 'Renata', "Bel'Veth": 'Belveth', 'FiddleSticks': 'Fiddlesticks',
        };
        const champKey = n => CHAMP_KEYS[n] ?? n;

        async function init() {
            const versionP = fetch('https://ddragon.leagueoflegends.com/api/versions.json')
                .then(r => r.json()).then(v => { DD = `https://ddragon.leagueoflegends.com/cdn/${v[0]}`; return v[0]; })
                .catch(() => '14.24.1');

            const [version] = await Promise.all([versionP]);

            fetch(`https://ddragon.leagueoflegends.com/cdn/${version}/data/en_US/champion.json`)
                .then(r => r.json())
                .then(({ data }) => renderSplash(Object.keys(data), version))
                .catch(() => { });

            const { summoners } = await fetch('/api/db/summoners/with-region').then(r => r.json());
            allSummoners = summoners;
            renderSummonerList(summoners);
            document.getElementById('search').addEventListener('input', e => {
                const q = e.target.value.toLowerCase();
                renderSummonerList(q ? allSummoners.filter(s => s.riot_id.toLowerCase().includes(q)) : allSummoners);
            });
        }

        function renderSplash(champKeys, version) {
            const base = `https://ddragon.leagueoflegends.com/cdn/${version}/img/champion`;
            const track = document.getElementById('splash-track');
            track.style.cssText = 'display:flex;gap:28px;padding:28px;align-items:flex-start;';

            const style = document.createElement('style');
            style.textContent = `
    @keyframes scrollUp { from{transform:translateY(0)} to{transform:translateY(-50%)} }
    .splash-col { display:flex; flex-direction:column; gap:28px; will-change:transform; flex-shrink:0; }
  `;
            document.head.appendChild(style);

            const CELL = 68;
            const GAP = 28;
            const cols = Math.ceil(window.innerWidth / (CELL + GAP)) + 1;
            const rowsNeeded = Math.ceil(window.innerHeight / (CELL + GAP)) + 2;

            // one big global shuffle, columns take non-overlapping slices → minimal cross-col repetition
            const globalPool = [...champKeys].sort(() => Math.random() - 0.5);
            while (globalPool.length < cols * rowsNeeded * 2) globalPool.push(...globalPool);

            for (let c = 0; c < cols; c++) {
                const col = document.createElement('div');
                // 80–140s range, staggered delay so columns don't move in sync
                const dur = 80 + c * 7 + Math.random() * 20;
                const delay = -(Math.random() * dur);
                col.className = 'splash-col';
                col.style.cssText = `animation: scrollUp ${dur.toFixed(1)}s linear ${delay.toFixed(1)}s infinite;`;

                const half = rowsNeeded;
                // each column gets its own non-overlapping slice; duplicate it once for the seamless loop
                const slice = globalPool.slice(c * half % globalPool.length, c * half % globalPool.length + half);
                [...slice, ...slice].forEach(key => {
                    const img = document.createElement('img');
                    img.src = `${base}/${key}.png`;
                    img.style.cssText = `width:${CELL}px;height:${CELL}px;border-radius:8px;display:block;flex-shrink:0;`;
                    img.onerror = () => { img.style.visibility = 'hidden'; };
                    col.appendChild(img);
                });
                track.appendChild(col);
            }

            track.style.opacity = '0.15';
        }

        function renderSummonerList(list) {
            const ul = document.getElementById('summoner-list');
            ul.innerHTML = '';
            list.forEach(({ riot_id, region }) => {
                const li = document.createElement('li');
                li.className = 'px-3 py-2.5 cursor-pointer hover:bg-slate-700/60 text-sm border-b border-slate-700/30 transition-colors';
                li.dataset.id = riot_id;
                li.innerHTML = `<div class="font-medium truncate">${riot_id.split('#')[0]}</div><div class="text-xs text-slate-400">${region}</div>`;
                li.onclick = () => selectSummoner(riot_id, li);
                if (riot_id === activeSummonerId) li.classList.add('bg-slate-700');
                ul.appendChild(li);
            });
        }

        async function selectSummoner(riot_id, el) {
            document.querySelectorAll('#summoner-list li').forEach(l => l.classList.remove('bg-slate-700'));
            el.classList.add('bg-slate-700');
            activeSummonerId = riot_id;
            activeMatchEl = null;
            activeMode = 'all';

            document.getElementById('match-list-header').textContent = riot_id.split('#')[0];
            document.getElementById('match-list').innerHTML = skeletonMatchList();
            document.getElementById('splash').classList.add('hidden');
            document.getElementById('detail-panel').classList.remove('hidden');
            document.getElementById('profile-strip').classList.add('hidden');
            document.getElementById('profile-view').classList.remove('hidden');
            document.getElementById('match-view').classList.add('hidden');
            document.getElementById('stats-row').innerHTML = skeletonStatsRow();
            document.getElementById('champ-grid').innerHTML = skeletonChampGrid();

            const [matchRes, statsRes] = await Promise.all([
                fetch(`/api/db/matches?riot_id=${encodeURIComponent(riot_id)}&count=50`).then(r => r.json()),
                fetch(`/api/db/summoner-stats?riot_id=${encodeURIComponent(riot_id)}`).then(r => r.json()),
            ]);

            activeMatches = matchRes.matches || [];
            activeStats = statsRes;

            renderMatchList(activeMatches);
            renderProfile(activeMode);
            setActiveTab(activeMode);
        }

        function renderMatchList(matches) {
            const container = document.getElementById('match-list');
            if (!matches.length) {
                container.innerHTML = '<p class="p-4 text-slate-500 text-sm">No cached matches yet.</p>';
                return;
            }
            container.innerHTML = '';
            matches.forEach(m => {
                const el = document.createElement('div');
                el.className = 'flex items-center gap-2 px-3 py-2 cursor-pointer hover:bg-slate-700/50 transition-colors border-l-2 ' + (m.win ? 'border-blue-600' : 'border-red-700');
                const modeLabel = QUEUE_LABEL[m.queue_id] || m.game_mode;
                el.innerHTML = `
      <img src="${DD}/img/champion/${champKey(m.champion)}.png" class="w-8 h-8 rounded shrink-0" onerror="this.style.display='none'">
      <div class="flex-1 min-w-0">
        <div class="text-sm font-medium truncate">${m.champion}</div>
        <div class="text-xs text-slate-400 truncate">${m.kills}/${m.deaths}/${m.assists} · ${modeLabel}</div>
      </div>
      <div class="text-xs text-slate-500 shrink-0">${fmtDate(m.game_creation)}</div>`;
                el.onclick = () => selectMatch(m.match_id, el);
                container.appendChild(el);
            });
        }

        function renderProfile(mode) {
            if (!activeStats) return;
            const s = mode === 'all' ? activeStats : (activeStats.by_mode?.[mode] ?? { total: 0, wins: 0, winrate: 0, avg_kda: 0 });
            const total = s.total ?? 0;
            const wins = s.wins ?? 0;
            const losses = s.losses ?? (total - wins);
            const winrate = s.winrate ?? 0;
            const kda = s.avg_kda ?? 0;
            const avgDur = s.avg_duration ? fmtDuration(s.avg_duration) : (activeStats.avg_duration ? fmtDuration(activeStats.avg_duration) : '—');

            document.getElementById('stats-row').innerHTML = `
    <div class="bg-slate-800 rounded-lg p-3 text-center">
      <div class="text-2xl font-bold">${total}</div>
      <div class="text-xs text-slate-400 mt-0.5">Games</div>
    </div>
    <div class="bg-slate-800 rounded-lg p-3 text-center">
      <div class="text-2xl font-bold ${winrate >= 50 ? 'text-blue-400' : 'text-red-400'}">${winrate}%</div>
      <div class="text-xs text-slate-400 mt-0.5">${wins}W ${losses}L</div>
    </div>
    <div class="bg-slate-800 rounded-lg p-3 text-center">
      <div class="text-2xl font-bold">${kda}</div>
      <div class="text-xs text-slate-400 mt-0.5">Avg KDA · ${mode === 'all' ? avgDur : '—'}</div>
    </div>`;

            renderWinrateChart(wins, losses);
            renderChampChart(activeStats.top_champions || []);
            renderChampGrid(activeStats.top_champions || []);
        }

        function renderWinrateChart(wins, losses) {
            if (chartWR) chartWR.destroy();
            const ctx = document.getElementById('chart-winrate').getContext('2d');
            chartWR = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    datasets: [{ data: [wins, losses], backgroundColor: ['#3b82f6', '#334155'], borderWidth: 0, hoverOffset: 4 }]
                },
                options: { cutout: '72%', plugins: { legend: { display: false }, tooltip: { enabled: false } }, animation: { duration: 400 } }
            });
            document.getElementById('winrate-label').textContent = wins + losses ? Math.round(wins / (wins + losses) * 100) + '%' : '—';
        }

        function renderChampChart(champs) {
            if (chartCH) chartCH.destroy();
            if (!champs.length) return;
            const ctx = document.getElementById('chart-champs').getContext('2d');
            chartCH = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: champs.map(c => c.champion),
                    datasets: [
                        { label: 'Wins', data: champs.map(c => c.wins), backgroundColor: '#3b82f688', borderRadius: 3 },
                        { label: 'Losses', data: champs.map(c => c.games - c.wins), backgroundColor: '#ef444444', borderRadius: 3 },
                    ]
                },
                options: {
                    indexAxis: 'y',
                    plugins: {
                        legend: { display: false }, tooltip: {
                            callbacks: {
                                label: ctx => ctx.dataset.label + ': ' + ctx.parsed.x
                            }
                        }
                    },
                    scales: {
                        x: { stacked: true, grid: { color: '#33415533' }, ticks: { color: '#94a3b8', font: { size: 10 } } },
                        y: { stacked: true, grid: { display: false }, ticks: { color: '#cbd5e1', font: { size: 10 } } }
                    },
                    animation: { duration: 400 }
                }
            });
        }

        function renderChampGrid(champs) {
            document.getElementById('champ-grid').innerHTML = champs.map(c => `
    <div class="bg-slate-800 rounded-lg p-2 flex flex-col items-center gap-1 text-center">
      <img src="${DD}/img/champion/${champKey(c.champion)}.png" class="w-10 h-10 rounded" onerror="this.style.display='none'">
      <div class="text-xs font-medium truncate w-full">${c.champion}</div>
      <div class="text-xs text-slate-400">${c.games}G · ${c.winrate}%</div>
      <div class="text-xs text-slate-500">${c.avg_kda} KDA</div>
    </div>`).join('');
        }

        function switchMode(mode) {
            activeMode = mode;
            setActiveTab(mode);
            renderProfile(mode);
        }

        function setActiveTab(mode) {
            document.querySelectorAll('.tab-btn').forEach(b => {
                const active = b.dataset.mode === mode;
                b.className = 'tab-btn px-3 py-1 rounded text-sm transition-colors ' +
                    (active ? 'bg-violet-700 text-white font-semibold' : 'text-slate-400 hover:text-white hover:bg-slate-700');
            });
        }

        async function selectMatch(match_id, el) {
            if (activeMatchEl) activeMatchEl.classList.remove('bg-slate-700');
            el.classList.add('bg-slate-700');
            activeMatchEl = el;

            document.getElementById('profile-view').classList.add('hidden');
            document.getElementById('match-view').classList.remove('hidden');
            document.getElementById('match-content').innerHTML = '<p class="text-slate-400 text-sm">Loading…</p>';

            const s = activeStats;
            const top3 = (s?.top_champions || []).slice(0, 3);
            document.getElementById('strip-champs').innerHTML = top3.map(c =>
                `<img src="${DD}/img/champion/${champKey(c.champion)}.png" class="w-7 h-7 rounded" title="${c.champion}" onerror="this.style.display='none'">`
            ).join('');
            document.getElementById('strip-name').textContent = activeSummonerId.split('#')[0];
            document.getElementById('strip-stats').textContent = s ? `${s.total}G · ${s.winrate}%WR · ${s.avg_kda} KDA` : '';
            document.getElementById('profile-strip').classList.remove('hidden');

            const data = await fetch(`/api/db/match/${match_id}?riot_id=${encodeURIComponent(activeSummonerId)}`).then(r => r.json());
            if (data.error) { document.getElementById('match-content').innerHTML = `<p class="text-red-400">${data.error}</p>`; return; }

            const blue = data.participants.filter(p => p.teamId === 100);
            const red = data.participants.filter(p => p.teamId === 200);
            const maxDmg = Math.max(...data.participants.map(p => p.totalDamageDealtToChampions), 1);

            document.getElementById('match-content').innerHTML = `
    <div class="flex items-center justify-between mb-4">
      <div>
        <span class="font-semibold">${data.game_mode_label}</span>
        <span class="text-slate-400 text-sm ml-2">${fmtDuration(data.game_duration)} · ${fmtDate(data.game_creation)}</span>
      </div>
      <button id="ai-btn" onclick="analyzeWithAI('${match_id}')"
        class="px-3 py-1.5 bg-violet-700 hover:bg-violet-600 rounded text-sm font-medium transition-colors">
        🤖 Analyze with AI
      </button>
    </div>
    <div id="ai-result" class="hidden mb-4 bg-slate-800 rounded p-3 text-sm text-slate-200 whitespace-pre-wrap leading-relaxed"></div>
    <div class="grid grid-cols-2 gap-3">
      ${teamTable(blue, 'Blue', data.focused_participant, maxDmg)}
      ${teamTable(red, 'Red', data.focused_participant, maxDmg)}
    </div>`;
        }

        function closeMatch() {
            if (activeMatchEl) activeMatchEl.classList.remove('bg-slate-700');
            activeMatchEl = null;
            document.getElementById('match-view').classList.add('hidden');
            document.getElementById('profile-strip').classList.add('hidden');
            document.getElementById('profile-view').classList.remove('hidden');
        }

        function teamTable(participants, label, focused, maxDmg) {
            const color = label === 'Blue' ? 'text-blue-400' : 'text-red-400';
            const rows = participants.map(p => {
                const dmgPct = Math.round(p.totalDamageDealtToChampions / maxDmg * 100);
                const hi = focused && p.puuid === focused.puuid ? 'bg-slate-600' : '';
                return `
      <div class="flex items-center gap-2 rounded px-2 py-1 ${hi}">
        <img src="${DD}/img/champion/${champKey(p.champion)}.png" class="w-7 h-7 rounded shrink-0" onerror="this.style.display='none'">
        <div class="flex-1 min-w-0">
          <div class="text-xs font-medium truncate">${p.name}</div>
          <div class="text-xs text-slate-400">${p.kills}/${p.deaths}/${p.assists}</div>
          <div class="h-1 mt-0.5 rounded bg-slate-700 overflow-hidden">
            <div class="h-full bg-violet-500" style="width:${dmgPct}%"></div>
          </div>
        </div>
      </div>`;
            }).join('');
            return `<div class="bg-slate-800 rounded-lg p-3">
    <div class="text-xs font-semibold ${color} mb-2">${label} Team</div>${rows}</div>`;
        }

        async function analyzeWithAI(match_id) {
            const btn = document.getElementById('ai-btn');
            const result = document.getElementById('ai-result');
            btn.disabled = true; btn.textContent = 'Analyzing…';
            result.classList.remove('hidden'); result.textContent = '…';
            const detail = await fetch(`/api/db/match/${match_id}?riot_id=${encodeURIComponent(activeSummonerId)}`).then(r => r.json());
            if (!detail.focused_participant || !detail.focused_stats) {
                result.textContent = 'No participant data for AI.'; btn.disabled = false; btn.textContent = '🤖 Analyze with AI'; return;
            }
            try {
                const { analysis } = await fetch('/api/ai/match-analysis', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre: detail.focused_participant.name, stats: detail.focused_stats, participant: detail.focused_participant, game_mode: detail.game_mode }),
                }).then(r => r.json());
                result.textContent = analysis ?? 'No analysis returned.';
            } catch (e) { result.textContent = `Error: ${e.message}`; }
            btn.disabled = false; btn.textContent = '🤖 Analyze with AI';
        }

        const fmtDuration = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
        const fmtDate = ms => new Date(ms).toLocaleDateString();

        // ── Modal ────────────────────────────────────────────────────────────
        let acTimer = null;

        function openModal() {
            document.getElementById('modal-backdrop').classList.remove('hidden');
            document.getElementById('modal-input').value = '';
            document.getElementById('modal-status').textContent = '';
            setTimeout(() => document.getElementById('modal-input').focus(), 50);
        }

        function closeModal(e) {
            if (e && e.target !== document.getElementById('modal-backdrop')) return;
            document.getElementById('modal-backdrop').classList.add('hidden');
            document.getElementById('modal-autocomplete').classList.add('hidden');
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') document.getElementById('modal-backdrop').classList.add('hidden');
        });

        function setupModalAutocomplete() {
            const input = document.getElementById('modal-input');
            const list = document.getElementById('modal-autocomplete');
            input.addEventListener('input', () => {
                clearTimeout(acTimer);
                const q = input.value.trim();
                if (q.length < 1) { list.classList.add('hidden'); return; }
                acTimer = setTimeout(async () => {
                    const { summoners } = await fetch(`/api/db/summoners/autocomplete?q=${encodeURIComponent(q)}&limit=8`).then(r => r.json());
                    if (!summoners.length) { list.classList.add('hidden'); return; }
                    list.innerHTML = summoners.map(s =>
                        `<li class="px-3 py-2 text-sm hover:bg-slate-600 cursor-pointer" onclick="pickAC('${s}')">${s}</li>`
                    ).join('');
                    list.classList.remove('hidden');
                }, 180);
            });
            input.addEventListener('keydown', e => { if (e.key === 'Enter') submitModal(); });
        }

        function pickAC(value) {
            document.getElementById('modal-input').value = value;
            const tag = value.split('#')[1];
            if (tag) {
                const sel = document.getElementById('modal-region');
                const opt = [...sel.options].find(o => o.value === tag.toUpperCase());
                if (opt) sel.value = opt.value;
            }
            document.getElementById('modal-autocomplete').classList.add('hidden');
        }

        async function submitModal() {
            const riot_id = document.getElementById('modal-input').value.trim();
            const region = document.getElementById('modal-region').value;
            const status = document.getElementById('modal-status');
            const btn = document.getElementById('modal-submit-btn');
            if (!riot_id.includes('#')) { status.textContent = 'Use Name#TAG format.'; return; }
            btn.disabled = true;
            btn.innerHTML = '<span class="inline-block w-3 h-3 border-2 border-white/30 border-t-white rounded-full animate-spin mr-2"></span>Loading…';
            status.textContent = 'Fetching matches from Riot API…';
            try {
                const res = await fetch(`/api/summoner/${encodeURIComponent(riot_id)}/match-history?region=${region}&count=10&analyze=false`);
                const data = await res.json();
                if (!res.ok) { status.textContent = data.error || 'Error fetching matches.'; btn.disabled = false; btn.textContent = 'Load matches'; return; }
                status.innerHTML = `<span class="text-green-400">✓ Loaded ${data.matches?.length ?? 0} matches for ${riot_id}</span>`;
                const { summoners } = await fetch('/api/db/summoners/with-region').then(r => r.json());
                allSummoners = summoners;
                renderSummonerList(summoners);
                setTimeout(() => {
                    const li = document.querySelector(`#summoner-list li[data-id="${riot_id}"]`);
                    if (li) li.click();
                    document.getElementById('modal-backdrop').classList.add('hidden');
                    btn.disabled = false; btn.textContent = 'Load matches';
                }, 800);
            } catch (e) { status.textContent = `Error: ${e.message}`; btn.disabled = false; btn.textContent = 'Load matches'; }
        }

        setupModalAutocomplete();
        init();

        function skeletonMatchList() {
            return Array.from({length: 8}, () => `
              <div class="flex items-center gap-2 px-3 py-2 border-l-2 border-slate-700">
                <div class="skeleton w-8 h-8 shrink-0"></div>
                <div class="flex-1 space-y-1.5">
                  <div class="skeleton h-3 w-3/4"></div>
                  <div class="skeleton h-2.5 w-1/2"></div>
                </div>
                <div class="skeleton h-2.5 w-10 shrink-0"></div>
              </div>`).join('');
        }

        function skeletonStatsRow() {
            return Array.from({length: 3}, () =>
              `<div class="bg-slate-800 rounded-lg p-3 space-y-2">
                <div class="skeleton h-7 w-16 mx-auto"></div>
                <div class="skeleton h-2.5 w-12 mx-auto"></div>
              </div>`).join('');
        }

        function skeletonChampGrid() {
            return Array.from({length: 8}, () =>
              `<div class="bg-slate-800 rounded-lg p-2 flex flex-col items-center gap-1">
                <div class="skeleton w-10 h-10 rounded"></div>
                <div class="skeleton h-2.5 w-14"></div>
                <div class="skeleton h-2 w-10"></div>
              </div>`).join('');
        }
    </script>
</body>
